name: micyou_flutter_frontend
description: >-
  Flutter (Material 3) reference frontend for the libmicyou backend —
  connects over WebSocket JSON-RPC; deployable as a static web bundle
  hosted by the daemon itself (--web-ui).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0

flutter:
  uses-material-design: true
