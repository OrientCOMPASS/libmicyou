<!doctype html>
<!--
  libmicyou — Tauri 2 reference frontend (vanilla JS, no bundler).
  Talks to the Rust side via window.__TAURI__ (withGlobalTauri), which in
  turn speaks JSON-RPC to the micyou-daemon sidecar.
  Copyright (C) 2026 OrientCOMPASS — GPL-3.0-or-later with MicYou Plugin Exception.
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>MicYou · Tauri Frontend</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 16px; background: #14161a; color: #e8eaee;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
      fieldset {
        border: 1px solid #2a2e37; border-radius: 8px; margin: 0 0 12px;
        padding: 10px 12px;
      }
      legend { color: #9aa3b2; padding: 0 4px; }
      .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
      input[type="text"] {
        background: #1b1e24; border: 1px solid #2a2e37; color: #e8eaee;
        border-radius: 6px; padding: 6px 8px; width: 90px;
      }
      input[type="text"].wide { width: 140px; }
      button {
        background: #2a2e37; color: #e8eaee; border: 1px solid #3a3f4b;
        border-radius: 6px; padding: 6px 14px; cursor: pointer;
      }
      button:hover { background: #343947; }
      button.primary { background: #4463f0; border-color: #4463f0; }
      button.primary:hover { background: #5b7cfa; }
      label { display: flex; gap: 6px; align-items: center; }
      #status { color: #9aa3b2; }
      #status .connected { color: #7ec87e; }
      .meter {
        height: 16px; background: #23262d; border-radius: 4px;
        overflow: hidden; margin: 8px 0;
      }
      .meter > div {
        height: 100%; width: 0%; background: #4caf50;
        transition: width 90ms linear;
      }
      .meter.muted > div { background: #6b6f78; }
      #log {
        background: #1b1e24; border-radius: 6px; padding: 8px;
        height: 160px; overflow-y: auto; color: #9aa3b2;
        white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px;
      }
      .pill {
        display: inline-block; padding: 1px 8px; border-radius: 999px;
        background: #23262d; margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <h1>libmicyou backend — Tauri sidecar 前端 <span class="pill" id="api">api ?</span></h1>

    <fieldset>
      <legend>服务器</legend>
      <div class="row">
        端口 <input id="port" type="text" value="18554" />
        模式 <input id="mode" type="text" class="wide" value="wifi" />
        <button class="primary" id="start">启动</button>
        <button id="stop">停止</button>
      </div>
      <div class="row" id="status">状态：连接中…</div>
    </fieldset>

    <fieldset>
      <legend>音频</legend>
      <div class="row">
        <label><input type="checkbox" id="mute" /> 静音（硬）</label>
        <label><input type="checkbox" id="monitor" /> 耳返监听</label>
      </div>
      <div class="meter" id="meter"><div></div></div>
      <div class="row" id="level-text">电平：--</div>
    </fieldset>

    <fieldset>
      <legend>日志</legend>
      <div id="log"></div>
    </fieldset>

    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;

      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      function log(line) {
        const at = new Date().toLocaleTimeString();
        logEl.textContent = `[${at}] ${line}\n` + logEl.textContent;
        if (logEl.textContent.length > 20000) {
          logEl.textContent = logEl.textContent.slice(0, 20000);
        }
      }

      async function refreshStatus() {
        try {
          const s = await invoke("backend_status");
          const conn = s.isConnected
            ? '<span class="connected">已连接设备</span>'
            : "无设备";
          $("status").innerHTML =
            `状态：<b>${s.phase}</b> · ${conn} · 静音 ${s.isMuted ? "是" : "否"}`;
          $("mute").checked = s.isMuted;
          $("monitor").checked = s.isMonitoring;
        } catch (e) {
          $("status").textContent = `状态：${e}`;
        }
      }

      $("start").onclick = async () => {
        const port = parseInt($("port").value, 10) || 18554;
        const mode = $("mode").value.trim().toLowerCase() || "wifi";
        try {
          const msg = await invoke("backend_start", { port, mode });
          log(`启动：${msg}`);
        } catch (e) { log(`启动失败：${e}`); }
        refreshStatus();
      };
      $("stop").onclick = async () => {
        try { log(`停止：${await invoke("backend_stop")}`); }
        catch (e) { log(`停止失败：${e}`); }
        refreshStatus();
      };
      $("mute").onchange = async (ev) => {
        try { await invoke("backend_set_mute", { muted: ev.target.checked }); }
        catch (e) { log(`静音失败：${e}`); }
      };
      $("monitor").onchange = async (ev) => {
        try { await invoke("backend_set_monitoring", { enabled: ev.target.checked }); }
        catch (e) { log(`监听失败：${e}`); }
      };

      listen("backend-state", (e) => {
        log(`后端会话：${e.payload}`);
        refreshStatus();
      });

      listen("backend-event", (e) => {
        const ev = e.payload; // {type, data}
        switch (ev.type) {
          case "audioLevel": {
            const v = Math.min(100, Math.max(0, ev.data.level));
            $("meter").firstElementChild.style.width = `${v}%`;
            $("level-text").textContent = `电平：${v}%`;
            break;
          }
          case "muteStateChanged":
            $("mute").checked = ev.data.muted;
            $("meter").classList.toggle("muted", ev.data.muted);
            refreshStatus();
            break;
          case "monitoringChanged":
            $("monitor").checked = ev.data.enabled;
            break;
          case "deviceConnected":
            log(`设备连接：${ev.data.device.name} (${ev.data.device.ip})`);
            refreshStatus();
            break;
          case "deviceDisconnected":
            log("设备断开");
            refreshStatus();
            break;
          case "serverStopped":
            log("服务器已停止");
            $("meter").firstElementChild.style.width = "0%";
            refreshStatus();
            break;
          case "udpAudioWarning":
            log("警告：TCP 已连接但长时间未收到 UDP 音频（防火墙？）");
            break;
          default:
            log(`事件：${ev.type}`);
        }
      });

      // 初始探测（sidecar 连接是异步的，轮询几次直到连上）
      (async function probe() {
        for (let i = 0; i < 30; i++) {
          try {
            if (await invoke("backend_connected")) {
              log("后端 sidecar 已连接（stdio JSON-RPC）");
              refreshStatus();
              return;
            }
          } catch (_) {}
          await new Promise((r) => setTimeout(r, 500));
        }
        log("后端连接超时：请确认 micyou-daemon 在 PATH / 同级目录 / $MICYOU_DAEMON");
      })();
    </script>
  </body>
</html>
