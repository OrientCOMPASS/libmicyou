[package]
name = "micyou-slint-frontend"
description = "Slint reference frontend for the libmicyou backend (in-process embedding over the local JSON-RPC transport)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Standalone workspace (mirrors how a real third-party frontend consumes
# libmicyou through path/git dependencies).
[workspace]

[lib]
name = "micyou_slint_frontend"
path = "src/lib.rs"

[[bin]]
name = "micyou-slint-frontend"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[dependencies]
# Default features (incl. the compat-1-x guard + winit/software/femtovg):
# the software renderer is used at runtime via SLINT_BACKEND when there is
# no GPU/display; tests never create a window.
slint = "1"
tokio = { version = "1", features = ["full"] }
libmicyou = { path = "../../crates/libmicyou" }
micyou-client = { path = "../../crates/micyou-client" }
micyou-api = { path = "../../crates/micyou-api" }
serde_json = "1"
log = { version = "0.4", features = ["std"] }

[profile.release]
lto = "thin"
strip = true
