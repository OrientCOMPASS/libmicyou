[package]
name = "bench-native"
description = "DSP chain benchmark for the pure-Rust native inference backend (purevox/aec7 compiled blobs)"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace on purpose: this harness must build against the
# checkout it lives in without touching the main workspace members.
[workspace]

[dependencies]
micyou-audio = { path = "../../crates/micyou-audio", features = ["noise-suppression"] }
serde_json = "1"

# Mirror the root workspace patch so the dependency graph matches CI builds.
[patch.crates-io]
opus-decoder = { git = "https://github.com/tfr0305/Rusopus.git", branch = "master" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
