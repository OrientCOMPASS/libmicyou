name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  ci:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev

      # Clippy is advisory while the refactor is in flight; it becomes a
      # blocking gate once the workspace stabilizes.
      - name: Clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # End-to-end smoke: drive the daemon over stdio JSON-RPC and validate
      # the response envelope (exercises logging, config, core, rpc wiring).
      - name: Daemon stdio smoke test
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"session/hello","params":{"name":"ci"}}' \
            '{"jsonrpc":"2.0","id":1,"method":"system/version"}' \
            '{"jsonrpc":"2.0","id":2,"method":"server/status"}' \
            | timeout 60 ./target/debug/micyou-daemon --stdio --no-mode-lock --no-log-file --mirror-logs \
            > smoke.out 2> smoke.err || true
          echo "--- daemon stderr (tail) ---"; tail -5 smoke.err
          echo "--- daemon stdout ---"; cat smoke.out
          jq -e 'select(.id==1) | .result.apiVersion == 1' smoke.out
          jq -e 'select(.id==2) | .result.phase == "stopped"' smoke.out
