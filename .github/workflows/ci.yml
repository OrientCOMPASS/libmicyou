name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  ci:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev

      # Clippy is advisory while the refactor is in flight; it becomes a
      # blocking gate once the workspace stabilizes.
      - name: Clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # End-to-end smoke: drive the daemon over stdio JSON-RPC and validate
      # the response envelope (exercises logging, config, core, rpc wiring).
      - name: Daemon stdio smoke test
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"session/hello","params":{"name":"ci"}}' \
            '{"jsonrpc":"2.0","id":1,"method":"system/version"}' \
            '{"jsonrpc":"2.0","id":2,"method":"server/status"}' \
            | timeout 60 ./target/debug/micyou-daemon --stdio --no-mode-lock --no-log-file --mirror-logs \
            > smoke.out 2> smoke.err || true
          echo "--- daemon stderr (tail) ---"; tail -5 smoke.err
          echo "--- daemon stdout ---"; cat smoke.out
          # jq -s (slurp): with -e on a multi-document stream, jq 1.x exits 4
          # when the LAST input line produces no output, even if an earlier
          # selection printed true — collect first, then assert.
          jq -s -e 'map(select(.id==1)) | .[0].result.apiVersion == 1' smoke.out
          jq -s -e 'map(select(.id==2)) | .[0].result.phase == "stopped"' smoke.out

  frontend-gui:
    name: micyou-gui frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontends/micyou-gui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontends/micyou-gui/src-tauri -> target
          cache-on-failure: true
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev
      # Frontend assets: license report generation + vue-tsc typecheck + vite
      # bundle. The ported Vue sources are compiled verbatim; the invoke shim
      # (src/adapter/tauri-core.ts) maps them onto the libmicyou RPC contract.
      - name: Build frontend (npm)
        working-directory: frontends/micyou-gui
        run: |
          npm ci
          npm run build
      # Tauri shell embedding ../dist and speaking JSON-RPC to the daemon.
      - name: Build shell (cargo)
        working-directory: frontends/micyou-gui/src-tauri
        run: cargo build

  frontend-tauri:
    name: tauri frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontends/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontends/tauri -> target
          cache-on-failure: true
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev
      - name: Build
        run: cargo build
      # Headless controller e2e: embedded backend (webview never created).
      - name: Test
        run: cargo test
