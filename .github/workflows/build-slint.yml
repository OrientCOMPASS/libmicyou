name: Slint Dev Build

# Development builds of the Slint reference frontend (self-contained:
# the backend is embedded). Artifacts only — no GitHub Release publishing.
# Release builds are produced separately when tagging (full matrix + bundles).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slint-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontends/slint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Incremental compilation cache for this frontend workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontends/slint -> target
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build (release)
        run: cargo build --release

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          mkdir -p stage/micyou-slint
          cp target/release/micyou-slint-frontend stage/micyou-slint/
          { git rev-parse --short HEAD; date -u; } > stage/micyou-slint/VERSION.txt
          cat > stage/micyou-slint/RUN-README.txt <<'NOTES'
          MicYou Slint 前端（开发构建，后端内嵌，单文件即跑）

          Linux:  ./micyou-slint-frontend
                 无 GPU/渲染异常时: SLINT_BACKEND=winit-software ./micyou-slint-frontend
                 glibc >= 2.35 (Ubuntu 22.04+ / Debian 12+ / Fedora 36+)
          macOS:  先 xattr -cr . 解除隔离（未签名），终端运行 ./micyou-slint-frontend
          日志:   内嵌后端仅 stderr 警告级；配置目录 ~/.config/micyou
          NOTES
          (cd stage && zip -r ../micyou-slint-${{ matrix.platform }}.zip micyou-slint)

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage\micyou-slint"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\micyou-slint-frontend.exe $stage
          (git rev-parse --short HEAD) + "`n" + (Get-Date).ToUniversalTime() | Set-Content $stage\VERSION.txt
          @'
          MicYou Slint 前端（开发构建，后端内嵌，双击即跑）
          SmartScreen 提示时: 更多信息 → 仍要运行（未签名）。
          配置目录: %APPDATA%\micyou
          '@ | Set-Content -Encoding UTF8 $stage\RUN-README.txt
          Compress-Archive -Path stage\micyou-slint -DestinationPath "micyou-slint-${{ matrix.platform }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: micyou-slint-${{ matrix.platform }}
          path: frontends/slint/micyou-slint-*.zip
          if-no-files-found: error
