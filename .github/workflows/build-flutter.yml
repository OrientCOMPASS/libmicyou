name: Flutter Dev Build

# Development builds of the Flutter DESKTOP reference frontend
# (linux-x64 / windows-x64 / macos-arm64), packaged together with the
# micyou-daemon sidecar it spawns over stdio — the same deployment shape
# as the real MicYou desktop app. Artifacts only — no Release publishing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            flutter-platform: linux
          - os: windows-2022
            platform: windows-x64
            flutter-platform: windows
          - os: macos-14
            platform: macos-arm64
            flutter-platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # ── daemon sidecar (Rust) ──────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - name: Build daemon (release)
        run: cargo build --release -p micyou-daemon

      # ── Flutter desktop toolchain ──────────────────────────────────
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate desktop scaffolding
        working-directory: frontends/flutter
        # single line: bash and pwsh both accept &&; desktop support is
        # enabled by default in current Flutter stable
        run: flutter config --no-analytics && flutter create --platforms=${{ matrix.flutter-platform }} --project-name micyou_flutter_frontend .

      - name: Build (release)
        working-directory: frontends/flutter
        run: flutter build ${{ matrix.flutter-platform }} --release

      # ── package ────────────────────────────────────────────────────
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          STAGE=stage/micyou-flutter
          mkdir -p "$STAGE"
          cp target/release/micyou-daemon "$STAGE"/
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R frontends/flutter/build/macos/Build/Products/Release/micyou_flutter_frontend.app "$STAGE"/
            cat > "$STAGE/RUN-README.txt" <<'NOTES'
          MicYou Flutter 桌面端（开发构建，未签名）+ micyou-daemon sidecar

          首次运行: xattr -cr .
          运行: open micyou_flutter_frontend.app
                （应用自动拉起同目录 micyou-daemon --stdio）
          也可在连接页改用远程 WebSocket 后端。
          NOTES
          else
            cp -r frontends/flutter/build/linux/x64/release/bundle "$STAGE/app"
            cat > "$STAGE/RUN-README.txt" <<'NOTES'
          MicYou Flutter 桌面端（开发构建）+ micyou-daemon sidecar

          运行: ./app/micyou_flutter_frontend
                （自动拉起上级目录的 micyou-daemon --stdio）
          依赖: libgtk-3（桌面发行版一般自带）
          也可在连接页改用远程 WebSocket 后端（daemon --ws 127.0.0.1:9610）。
          NOTES
          fi
          { git rev-parse --short HEAD; date -u; } > "$STAGE/VERSION.txt"
          (cd stage && zip -ry "../micyou-flutter-${{ matrix.platform }}.zip" micyou-flutter)
          ls -la micyou-flutter-*.zip

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage\micyou-flutter"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\micyou-daemon.exe $stage
          Copy-Item -Recurse frontends\flutter\build\windows\x64\runner\Release $stage\app
          (git rev-parse --short HEAD) + "`n" + (Get-Date).ToUniversalTime() | Set-Content $stage\VERSION.txt
          @'
          MicYou Flutter 桌面端（开发构建）+ micyou-daemon sidecar

          运行: app\micyou_flutter_frontend.exe
                （自动拉起上级目录 micyou-daemon.exe --stdio）
          SmartScreen 提示时: 更多信息 → 仍要运行（未签名）。
          也可在连接页改用远程 WebSocket 后端。
          '@ | Set-Content -Encoding UTF8 $stage\RUN-README.txt
          Compress-Archive -Path stage\micyou-flutter -DestinationPath "micyou-flutter-${{ matrix.platform }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: micyou-flutter-${{ matrix.platform }}
          path: micyou-flutter-*.zip
          if-no-files-found: error
